<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Squid Manager Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-dark text-white p-4">
<div class="container mt-4 mb-5">
  <h1 class="mb-3 text-center">Squid Proxy Status</h1>
  <div class="card mb-4 shadow-sm border-light">
    <div class="card-header bg-primary text-white py-2 px-3 rounded-top">
      Squid Service
    </div>
    <div class="card-body p-3">
      {% if not SQUID_STATUS.running %}<span class="badge badge-danger position-fixed top-0 start-0 mx-1">Stopped</span>{% else %}<span class="badge badge-success position-fixed top-0 start-0 mx-1">Running</span>{% endif %}
      <button id="start-btn" type="button" class="btn btn-primary w-auto me-2 mb-3{% if not SQUID_STATUS.running %} disabled{% endif %}">
        {% if not SQUID_STATUS.running %}<i class="far fa-play-circle"></i> Start{% else %}<i class="fas fa-arrow-up"></i> Restart{% endif %}
      </button>
      <button id="stop-btn" type="button" class="btn btn-danger w-auto mb-3{% if SQUID_STATUS.running %} disabled{% endif %}">
        {% if SQUID_STATUS.running %}<i class="fas fa-stop"></i> Stop{% else %}<i class="fas fa-pause"></i> Restart{% endif %}
      </button>
      <div id="status-output" class="text-white mt-3">{{ SQUID_STATUS.output or "Squid status unavailable." }}</div>
    </div>
  </div>
</div>
<script>
const startBtn = document.getElementById('start-btn');
const stopBtn = document.getElementById('stop-btn');
function logAction(type) {
  fetch('/logs/api/tail', {method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type,type})});
}
if (SQUID_STATUS.running) {
  stopBtn.disabled = false;
  startBtn.disabled = true;
} else {
  startBtn.disabled = false;
  stopBtn.disabled = true;
}
startBtn.onclick = () => fetch('/dashboard/start', {method:'POST'}).then(r=>r.json()).then(d=>{
  if (d.status=="ok") { logAction('service_start'); window.location.reload(); }
});
stopBtn.onclick = () => fetch('/dashboard/stop', {method:'POST'}).then(r=>r.json()).then(d=>{if (d.status=="ok") { logAction('service_stop'); }});
</script>
</body>
</html>
