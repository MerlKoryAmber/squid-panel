<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
</head>
<body class="bg-dark text-white p-4">
<div class="container mt-4 mb-5 d-grid gap-2 justify-content-center">
  {% if error %}<div class="alert alert-danger mb-3" role="alert">{{ error }}</div>{% endif %}
  <button id="add-param-btn" type="button" class="btn btn-primary me-2 mt-4">Add Parameter</button>
  <button id="ntlm-template-btn" type="button" class="btn btn-outline-info me-2 mt-4">NTLM Template</button>
  <button id="kerberos-template-btn" type="button" class="btn btn-outline-info mt-4">Kerberos Template</button>
  {% if winbind_status %}<small><em>Winbind: {{ winbind_status }}</em></small>{% endif %}
  {% if kerb_status %}<small><em>Kerberos: {{ kerb_status }}</em></small>{% endif %}
  <table class="table table-hover border-light">
    <thead><tr><th scope="col" class="text-white">#</th><th scope="col" class="text-white">Parameter (badge)</th><th scope="col"></th></tr></thead>
    <tbody>{% for index, param in enumerate(auth_params) %}<tr><td>{{ index + 1 }}</td><td class="badge bg-primary">{{ param.scheme }} {{ param.param_name }}</td>
      <td><button id="delete-auth-param-{{ param.scheme }}{{ param.param_name }}" type="button" class="btn btn-outline-danger ml-2">Delete</button></td>
    </tr>{% endfor %}</tbody>
  </table>
</div>
<script>
const addBtn = document.getElementById('add-param-btn');
addBtn.onclick = () => { window.location.href='/auth_methods/add/'; };
{% for index, param in enumerate(auth_params) %}
    const deleteBtn = document.getElementById('delete-auth-param-' + encodeURIComponent(param.scheme + param.param_name));
    if (deleteBtn) {
        deleteBtn.onclick = () => { if (!confirm('Delete auth_param "' + param.scheme + ' ' + param.param_name + '"?')) return; fetch('/auth_methods/delete/' + encodeURIComponent(index), {method:'POST'}).then(r=>{if(r.ok) window.location.reload();}); };
    }
{% endfor %}
</script>
</body>
</html>
