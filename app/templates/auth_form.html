<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
</head>
<body class="bg-dark text-white p-4">
<div class="container mt-4 mb-5 d-grid gap-2 justify-content-center">
  {% if error %}<div class="alert alert-danger mb-3" role="alert">{{ error }}</div>{% endif %}
  <form method="post" onsubmit="return confirm('Create auth_param {{ scheme }} {{ param_name }}?');" action="/auth_methods/add/">
    <input type="hidden" name="scheme" value="{{ scheme or '' }}">
    <input type="hidden" name="param_name" value="{{ param_name or '' }}">
    <label for="parameter-value">Parameter Value</label><small class="text-muted ms-1">Enter the parameter value.</small><br/>
    <input id="parameter-value" name="value" placeholder="example.com, 10.0.0.1, 8080" value="{{ value or '' }}" class="form-control mt-2">
    <button type="submit" class="btn btn-primary w-auto mt-3">Save</button>
  </form>
</div>
<script>
{% for s in AUTH_SCHEMES %}
    const sel = document.querySelector('#scheme');
    if (sel) {
        const opt = document.createElement('option');
        opt.value = '{{ s }}';
        opt.textContent = '{{ s }}';
        sel.appendChild(opt);
    }
{% endfor %}
const schemeSel = document.querySelector('#scheme');
schemeSel.addEventListener('change', () => {
    const paramSel = document.querySelector('#param_name');
    if (paramSel) {
        paramSel.innerHTML = '';
        for (const p of AUTH_PARAMS[schemeSel.value] || []) {
            const opt = document.createElement('option');
            opt.value = p.param;
            opt.textContent = p.param;
            paramSel.appendChild(opt);
        }
    }
});
</script>
</body>
</html>
