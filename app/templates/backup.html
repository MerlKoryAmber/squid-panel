<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
</head>
<body class="bg-dark text-white p-4">
<div class="container mt-4 mb-5 d-grid gap-2 justify-content-center">
  {% if error %}<div class="alert alert-danger mb-3" role="alert">{{ error }}</div>{% endif %}
  <button id="create-backup-btn" type="button" class="btn btn-primary me-2 mt-4">Create Backup</button>
  <button id="download-full-archive-btn" type="button" class="btn btn-outline-info mt-4">Download Full Archive</button>
  {% if not backups or len(backups) == 0 %}<p class="text-muted mb-3">No backup files found.</p>{% endif %}
  <table class="table table-hover border-light">
    <thead><tr><th scope="col" class="text-white">Filename</th><th scope="col" class="text-white">Size (KB)</th><th scope="col" class="text-white">Date</th><th scope="col"></th></tr></thead>
    <tbody>{% for backup in backups %}<tr><td>{{ backup.filename }}</td><td>{{ round(backup.size/1024, 2) }} KB</td><td>{{ backup.date.strftime('%Y-%m-%d') }}</td>
      <td><button id="download-backup-{{ backup.filename | replace(' ', '_') }}" type="button" class="btn btn-outline-primary">Download</button>&nbsp;<button id="restore-backup-{{ backup.filename | replace(' ', '_') }}" type="button" class="btn btn-outline-danger ml-1">Restore</button></td>
    </tr>{% endfor %}</tbody>
  </table>
</div>
<script>
const createBtn = document.getElementById('create-backup-btn');
createBtn.onclick = () => fetch('/backup/create', {method:'POST'}).then(r=>r.json()).then(d=>{alert(d.message || 'Backup created.');});
{% for backup in backups %}
    const downloadBtn = document.getElementById('download-backup-' + encodeURIComponent(backup.filename));
downloadBtn.onclick = () => {
      fetch('/backup/download/' + encodeURIComponent(backup.filename), {method:'GET', headers:{'Content-Disposition':'attachment; filename="'+backup.filename+'"'}});
    };
    const restoreBtn = document.getElementById('restore-backup-' + encodeURIComponent(backup.filename));
    if (restoreBtn) {
        restoreBtn.onclick = () => {
            if (!confirm('Restore backup "' + backup.filename + '"? This will replace the current Squid config and reconfigure. All changes since backup are lost.')) return;
            fetch('/backup/restore/' + encodeURIComponent(backup.filename), {method:'POST'}).then(r=>r.json()).then(d=>{alert(d.message || 'Backup restored.');});
        };
    }
{% endfor %}
</script>
</body>
</html>
