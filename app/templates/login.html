<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Squid Manager Login</title>
</head>
<body class="bg-dark text-white p-4">
<div class="container mt-3">
  <h1 class="mb-4 text-center">Squid Proxy Manager</h1>
  <form method="post" autocomplete="off">
    <div class="form-group mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" id="username" name="username" required class="form-control" />
    </div>
    <div class="form-group mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" name="password" required class="form-control" />
    </div>
    <button type="submit" class="btn btn-primary w-auto me-2">Sign In</button>
  </form>
  <p class="mt-4 text-center"><a href="#" onclick="document.getElementById('login_form').style.display='none'; document.getElementById('reset_form').style.display='block'">Forgot password?</a></p>
  <form id="reset_form" style="display:none;">
    <div class="form-group mb-3">
      <label for="username_reset" class="form-label">Username</label>
      <input type="text" id="username_reset" name="username_reset" required class="form-control" />
    </div>
    <button type="submit" class="btn btn-primary w-auto me-2">Reset Password</button>
  </form>
  {% for message in get_flashed_messages() %}<p>{{ message }}</p>{% endfor %}
</div>
</body>
</html>
