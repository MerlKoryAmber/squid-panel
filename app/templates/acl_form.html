<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
</head>
<body class="bg-dark text-white p-4">
<div class="container mt-4 mb-5 d-grid gap-2 justify-content-center">
  {% if error %}<div class="alert alert-danger mb-3" role="alert">{{ error }}</div>{% endif %}
  <form method="post" onsubmit="return confirm('Create ACL "{{ name }}"?');" action="/acls/add/">
    <input type="hidden" name="name" value="{{ name or '' }}">
    <label for="acl-type">Type</label>
    <select id="acl-type" name="type" class="form-select form-control mt-2" required>{% for t in ACL_TYPES %}<option value="{{ t }}"{% if type == t %} selected{% endif %}>{{ t }}</option>{% endfor %}</select>
    <label for="values">Values</label><small class="text-muted ms-1">Comma-separated list (or omit for none).</small><br/>
    <input type="text" id="values" name="values" placeholder="example.com, 192.168.0.0/24" value="{{ values or '' }}" class="form-control mt-2">
    <button type="submit" class="btn btn-primary w-auto mt-3">Save</button>
  </form>
</div>
<script>
if (typeof name !== 'undefined' && name.trim() === "") { document.getElementById('acl-type').disabled = true; }
{% for t in ACL_TYPES %}
    const sel = document.querySelector('#acl-type');
    if (sel) {
        const opt = document.createElement('option');
        opt.value = '{{ t }}';
        opt.textContent = '{{ t }}';
        sel.appendChild(opt);
    }
{% endfor %}
</script>
</body>
</html>
